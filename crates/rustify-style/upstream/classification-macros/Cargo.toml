[package]
name = "rustify-classification-macros"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = ["crates-io"]
description = "Byte classification derive for the Rustify Tailwind scanner"

repository = "https://github.com/rockie/rustify-ui"
documentation = "https://docs.rs/rustify-classification-macros/0.2.0"
readme = "README.md"
rust-version = "1.99"
include = ["src/**", "README.md", "LICENSE"]

[lib]
name = "classification_macros"
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
