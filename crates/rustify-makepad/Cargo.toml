[package]
name = "rustify-makepad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Private Makepad integration: region Cx ownership, bridge and release"

[dependencies]
# The DOM core, for the one type the two halves share. No rendering mode is
# asked for: this crate is a bridge, and what it needs from the core is a type.
rustify-dom = { path = "../rustify-dom", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
makepad-widgets.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "AbortSignal",
    "AddEventListenerOptions",
    "Element",
    "HtmlCanvasElement",
] }
