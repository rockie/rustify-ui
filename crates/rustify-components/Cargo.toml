[package]
name = "rustify-components"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "DOM components for the Rustify UI SDK, forked from Rust/UI and rewritten to be controlled, CSP-clean and reachable"

[features]
default = ["csr"]
csr = ["rustify-ui/csr", "leptos/csr"]
hydrate = ["rustify-ui/hydrate", "leptos/hydrate"]
ssr = ["rustify-ui/ssr", "leptos/ssr"]
# A convenience for an application that also draws GPU regions; the
# components themselves draw none.
gpu = ["rustify-ui/gpu"]
utility = ["rustify-ui/utility"]

[dependencies]
leptos.workspace = true
# Without its defaults, so that this crate's own csr or ssr is the only one.
rustify-ui = { path = "../rustify-ui", default-features = false }
# Class-string merging. Pure Rust, no Leptos feature: the component crate
# decides what a class list means, not the library that merges it.
rustify-style = { path = "../rustify-style" }
paste = "1"
js-sys.workspace = true
# The drop zone reads a `DragEvent`'s file list, and the picker its input's.
# Everything else these components touch, Leptos already enables.
web-sys = { workspace = true, features = [
    "DataTransfer",
    "DragEvent",
    "File",
    "FileList",
    # A text field has to know when an input method is composing in it: the
    # keys being used to look a character up are not a value.
    "CompositionEvent",
    # The windowed table reads and sets a scroll position. Named here rather
    # than left to whatever the build that pulled this crate in enabled: the
    # accessors exist on two types with different signatures.
    "Element",
    "FocusOptions",
    "CssStyleSheet",
    "CssStyleRule",
    "CssRuleList",
    "StyleSheet",
] }

[dev-dependencies]
serde_json = "1"
