[package]
name = "rustify-components"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "DOM components for the Rustify UI SDK, forked from Rust/UI and rewritten to be controlled, CSP-clean and reachable"

repository = "https://github.com/rockie/rustify-ui"
documentation = "https://docs.rs/rustify-components/0.2.1"
readme = "README.md"
rust-version = "1.99"
include = ["src/**", "README.md", "LICENSE", "css/**", "LICENSE-RUST-UI", "vendor/radix/**"]

[features]
default = ["csr"]
csr = ["rustify-ui/csr", "leptos/csr"]
hydrate = ["rustify-ui/hydrate", "leptos/hydrate"]
ssr = ["rustify-ui/ssr", "leptos/ssr"]
utility = ["rustify-ui/utility"]

[dependencies]
leptos.workspace = true
cssparser = "0.37.0"
# Without its defaults, so that this crate's own csr or ssr is the only one.
# The core, under the name the components have always imported: they draw no
# GPU regions, so they take no SDK facade and no Makepad with it. An
# application that draws regions depends on `rustify-ui` itself and enables
# gpu there.
rustify-ui = { package = "rustify-dom", path = "../rustify-dom", version = "=0.2.1", default-features = false }
# Class-string merging. Pure Rust, no Leptos feature: the component crate
# decides what a class list means, not the library that merges it.
rustify-style = { path = "../rustify-style", version = "=0.2.1" }
paste = "1"
js-sys.workspace = true
# The drop zone reads a `DragEvent`'s file list, and the picker its input's.
# Everything else these components touch, Leptos already enables.
web-sys = { workspace = true, features = [
    "DataTransfer",
    "DragEvent",
    "File",
    "FileList",
    # A text field has to know when an input method is composing in it: the
    # keys being used to look a character up are not a value.
    "CompositionEvent",
    "HtmlFormElement",
    "HtmlFormControlsCollection",
    "HtmlInputElement",
    "HtmlSelectElement",
    "MutationObserver",
    "MutationObserverInit",
    "NodeList",
    # The windowed table reads and sets a scroll position. Named here rather
    # than left to whatever the build that pulled this crate in enabled: the
    # accessors exist on two types with different signatures.
    "Element",
    "FocusOptions",
    "CssStyleSheet",
    "CssStyleRule",
    "CssRuleList",
    "StyleSheet",
] }

[dev-dependencies]
serde_json = "1.0.151"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rustify_repo_tests)'] }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
no-default-features = true
features = ["ssr"]
