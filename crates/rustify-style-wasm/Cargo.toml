[package]
name = "rustify-style-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "WebAssembly bindings for Rustify Style."

repository = "https://github.com/rockie/rustify-ui"
documentation = "https://docs.rs/rustify-style-wasm/0.2.1"
readme = "README.md"
rust-version = "1.99"
include = ["src/**", "README.md", "LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
cn = ["rustify-style/cn", "dep:js-sys", "dep:wasm-bindgen-futures"]
baseline = ["dep:serde_json"]
scanner = ["rustify-style/scanner", "dep:serde_json"]
compiler = ["rustify-style/compiler", "dep:serde", "dep:serde_json", "dep:js-sys"]
compiler-api = ["compiler", "dep:js-sys"]
# Upstream internal helpers, only for executing the upstream unit tests.
upstream-units = ["compiler-api"]

[dependencies]
rustify-style = { path = "../rustify-style", version = "=0.2.1", default-features = false }
wasm-bindgen.workspace = true
js-sys = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4.78", optional = true }
serde_json = { version = "1.0.151", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rustify_repo_tests)'] }

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = []
features = ["compiler", "scanner"]
