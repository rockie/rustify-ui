[package]
name = "rustify-docs-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Procedural site registry declarations for Rustify Docs"

[lib]
proc-macro = true

[dependencies]
rustify-docs-syntax = { path = "../rustify-docs-syntax" }
syn = { version = "=2.0.119", features = ["full"] }
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
serde_json = "=1.0.151"
