[package]
name = "rustify-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Experimental SDK for Leptos DOM applications, with Makepad GPU regions as an opt-in"

[features]
default = ["csr"]
# Client-side rendering in the browser: the DOM runtime, its host and every
# browser module.
csr = ["rustify-dom/csr"]
hydrate = ["rustify-dom/hydrate"]
# Rendering on a host into HTML. Built on its own, never together with csr.
ssr = ["rustify-dom/ssr"]
# Makepad GPU regions. Off by default: a DOM application links no Makepad.
# Turning it on also withdraws the core's DOM host export, because this host
# creates the page's host itself through the Makepad loader.
gpu = ["dep:rustify-makepad", "csr", "rustify-dom/external-host"]
utility = ["rustify-dom/utility", "dep:rustify-style"]

[dependencies]
# The core. No default features: each rendering mode is chosen here and passed
# down, so a host never gets two of them at once.
rustify-dom = { path = "../rustify-dom", default-features = false }
rustify-makepad = { path = "../rustify-makepad", optional = true }
# The GPU halves of the utility compiler read declarations and text straight
# from the style crate.
rustify-style = { path = "../rustify-style", default-features = false, features = [
    "cn",
    "protocol",
], optional = true }
# The region bridge and the GPU controls are components and context values in
# their own right, not re-exported core items.
leptos.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(web_sys_unstable_apis)'] }
