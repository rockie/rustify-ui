ab_glyph_rasterizer = { path = "../../makepad/libs/ab_glyph_rasterizer", version = "=0.1.8" }
sdfer = { path = "../../makepad/libs/sdfer", version = "=0.2.1" }
makepad-zune-png = { path = "../../makepad/libs/zune/zune-png", version = "=0.5.2" }
