[package]
name = "rustify-theme-text-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde"))'] }

[dependencies]
makepad-shared-bytes = { path = "../../makepad/libs/shared_bytes", version = "=1.0.0" }
