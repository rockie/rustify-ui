[package]
name = "hydration-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "export-hydration-assets"
path = "src/bin/export-hydration-assets.rs"
required-features = ["ssr"]

[features]
default = []
ssr = ["leptos/ssr", "rustify-ui/ssr", "rustify-components/ssr"]
hydrate = ["leptos/hydrate", "rustify-ui/hydrate", "rustify-components/hydrate"]
csr = ["leptos/csr", "rustify-ui/csr", "rustify-components/csr"]

[dependencies]
leptos = { version = "=0.8.22", default-features = false }
rustify-ui = { path = "../../../crates/rustify-ui", default-features = false }
rustify-components = { path = "../../../crates/rustify-components", default-features = false }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = ["Document", "Element", "Event", "HtmlElement", "Window"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
