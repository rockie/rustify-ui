<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dom-consumer</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./rustify-runtime.css">
    <link rel="stylesheet" href="./rustify.css">
    <link rel="modulepreload" href="./rustify-dom-loader.js">
    <script type="module" src="./app.js"></script>
</head>
<body>
    <main>
        <h1>dom-consumer</h1>
        <p>A Rustify UI application with its default features: DOM only, no GPU.</p>
        <!-- The instance the page boots. It owns the address bar. -->
        <section>
            <h2>instance one</h2>
            <div id="instance-one" data-testid="instance-one"></div>
        </section>
        <!-- Where a second instance mounts: one of two failing is what makes
             "the other one is unaffected" a question. -->
        <section>
            <h2>instance two</h2>
            <div id="instance-two" data-testid="instance-two"></div>
        </section>
        <p id="status" data-testid="status"></p>
    </main>
</body>
</html>
