[package]
name = "makepad-script"
version = "1.0.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "Makepad script (splash)"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/makepad/makepad/"
repository = "https://github.com/makepad/makepad/"
metadata.makepad-auto-version = "yK9xdn_D0D3EdqleI-WHLtjk4rk="

[features]
default = ["check_gen"]
check_gen = []

[dependencies]
makepad-error-log = {path = "../../libs/error_log", version = "1.0.0" }
makepad-stitch = {path = "../../libs/stitch", version = "0.1.0" }
makepad-math = {path = "../../libs/math", version = "1.0.0" }
makepad-live-id = {path = "../../libs/live_id", version = "1.0.0" }
makepad-script-derive = {path = "./derive", version = "1.0.0" }
smallvec = { version = "1.15", path = "../../libs/smallvec" }
makepad-regex = {path = "../../libs/regex", version = "0.1.0" }
makepad-html = {path = "../../libs/html", version = "1.0.0" }

# The script VM runs its compiled math through `makepad-stitch`, a threaded-code
# interpreter: every instruction ends in a sibling call to the next one, and
# only an optimising build turns those calls into jumps. At opt-level 0 each
# executed instruction keeps its native frame alive until the whole function
# returns, so a wasm loop of a few thousand trips overflows the thread stack -
# which is what `math_aot`'s batch tests do. Stitch declares the same setting in
# its own manifest (`libs/stitch/Cargo.toml`), but that is ignored for a path
# dependency, so the consuming root has to ask for it.
[profile.dev.package.makepad-stitch]
opt-level = 1
