[workspace]
resolver = "2"
members = [
    "crates/rustify-components",
    "crates/rustify-ui",
    "crates/rustify-makepad",
    "examples/fusion-basic",
    "examples/property-workbench",
    "xtask",
]
exclude = ["makepad", "ref"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
leptos = { version = "=0.8.20", features = ["csr"] }
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
web-sys = "=0.3.105"
makepad-widgets = { path = "makepad/widgets" }

[patch.crates-io]
bitflags = { path = "makepad/libs/bitflags" }
smallvec = { path = "makepad/libs/smallvec" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
