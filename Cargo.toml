[workspace]
resolver = "2"
members = [
    "crates/rustify-style",
    "crates/rustify-style-wasm",
    "crates/rustify-components",
    "crates/rustify-ui",
    "crates/rustify-makepad",
    "examples/component-catalog",
    "examples/data-workbench",
    "examples/fusion-basic",
    "examples/property-workbench",
    "examples/vellum",
    "examples/theme-studio",
    "examples/utility-lab",
    "xtask",
]
exclude = ["makepad", "ref"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# No rendering mode here: each package picks csr or ssr for itself, so a
# server-side consumer is not handed the browser's effects by the workspace.
leptos = { version = "=0.8.22" }
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
web-sys = "=0.3.105"
makepad-widgets = { path = "makepad/widgets" }

[patch.crates-io]
bitflags = { path = "makepad/libs/bitflags" }
smallvec = { path = "makepad/libs/smallvec" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
