[package]
name = "utility-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
leptos = { workspace = true, features = ["csr"] }
rustify-ui = { path = "../../crates/rustify-ui", features = ["gpu", "utility"] }
rustify-style = { path = "../../crates/rustify-style", default-features = false, features = ["protocol"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustify-components = { path = "../../crates/rustify-components", features = ["utility"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4.78"
