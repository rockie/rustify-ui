[package]
name = "data-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
leptos.workspace = true
rustify-ui = { path = "../../crates/rustify-ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustify-makepad = { path = "../../crates/rustify-makepad" }
wasm-bindgen.workspace = true
# Named rather than left to whatever Leptos happens to enable: the sliced job
# reads a clock between slices, and a budget that silently lost its clock would
# be a budget that never ends.
web-sys = { workspace = true, features = ["Performance", "Window"] }
