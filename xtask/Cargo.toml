[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The capability document is printed from the table the components are
# declared in, so the command that writes it has to be able to read that table.
rustify-components = { path = "../crates/rustify-components" }
rustify-style = { path = "../crates/rustify-style", default-features = false, features = ["compiler", "scanner"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# Reads the guides' structure for the reference site B profile.
pulldown-cmark = { version = "0.13.4", default-features = false }
wasmi = "2.0"
wasm-bindgen-cli-support = "=0.2.128"
