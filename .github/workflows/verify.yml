name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --workspace --lib
      - name: Fork unit tests
        run: cargo test
        working-directory: makepad
      - name: Fork script VM tests
        run: cargo test --manifest-path platform/script/Cargo.toml
        working-directory: makepad
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Source record
        run: cargo xtask sources verify
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install pinned devDependencies
        run: npm ci
      - name: Component stylesheet is in step with the classes
        run: cargo xtask css --check
      - name: Capability document is in step with the catalogue
        run: cargo xtask catalog --write docs/components.md --check

  web:
    name: release web build and browser probes
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Doctor (reports only, installs nothing)
        run: cargo xtask doctor
        continue-on-error: true
      - name: Build fusion-basic
        run: cargo xtask build-web --example fusion-basic --release
      - name: Build property-workbench
        run: cargo xtask build-web --example property-workbench --release
      - name: Build component-catalog
        run: cargo xtask build-web --example component-catalog --release
      - name: Build data-workbench
        run: cargo xtask build-web --example data-workbench --release
      - name: Build vellum
        run: cargo xtask build-web --example vellum --release
      - name: Install pinned Playwright
        run: npm ci && npx playwright install --with-deps chromium
      # Named one by one rather than run as a whole: a headed project measures
      # what a rasteriser can do, and a runner without a display would report
      # the software one under the hardware one's name. `budget-scene` is
      # absent for exactly that reason - R30 AC2 over B3 is gated on headed
      # Chrome only (A-3), and this runner has no GPU to gate against.
      - name: Browser probes (Playwright Chromium; not the macOS Chrome pass gate)
        run: >-
          npx playwright test
          --project=fusion-basic
          --project=property-workbench
          --project=component-catalog
          --project=data-workbench
          --project=budget
          --project=budget-minimal
          --project=budget-data
          --project=workbench-deep
          --project=deployment
      - name: Vellum browser probes
        run: npx playwright test -c tests/vellum/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results
            target/makepad-wasm-app/release/fusion-basic/build-manifest.json
            target/makepad-wasm-app/release/property-workbench/build-manifest.json
            target/makepad-wasm-app/release/component-catalog/build-manifest.json
            target/makepad-wasm-app/release/data-workbench/build-manifest.json
            target/makepad-wasm-app/release/vellum/build-manifest.json
