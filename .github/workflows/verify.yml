name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host checks
    runs-on: macos-14
    # A few minutes normally; the limit is for a runner that stops answering.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust, mbx and Tailwind from mise.toml
        uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
      - name: Format
        run: cargo fmt --all -- --check
      # `--bins` as well: xtask and the examples are binaries, and their tests
      # do not run under `--lib`. The docs packages render on the host with
      # `ssr`; built together with the browser packages, Cargo would unify
      # both modes into one Leptos, so they run on their own below.
      - name: Unit tests
        run: mbx test --locked --workspace --exclude rustify-docs --exclude rustify-docs-cli --lib --bins
      # Features the workspace run leaves off: the style crate's compiler and
      # scanner, its Worker facade, and the SDK's runtime utilities. The
      # upstream Tailwind conformance gate needs the local-only ref/ tree and
      # runs by hand (`mbx xtask utility-conformance --check`).
      - name: Style compiler, scanner and Worker facade
        run: |
          mbx test --locked -p rustify-style --all-features --lib
          mbx test --locked -p rustify-style-wasm --no-default-features --features compiler,scanner --lib
      - name: SDK runtime utilities
        run: mbx test --locked -p rustify-ui -p rustify-components --features rustify-components/utility --lib
      # Each of the SDK's builds on its own: the default is DOM only, `gpu`
      # adds Makepad regions, and `ssr` renders on a host. The workspace run
      # above unifies features, so it proves none of them.
      - name: SDK and components in their DOM, GPU and SSR builds
        run: |
          for package in rustify-ui rustify-components; do
            mbx test --locked -p "$package" --lib
            mbx test --locked -p "$package" --features gpu --lib
            mbx test --locked -p "$package" --no-default-features --features ssr --lib
            mbx clippy --locked -p "$package" --all-targets -- -D warnings
            mbx clippy --locked -p "$package" --features gpu --all-targets -- -D warnings
            mbx clippy --locked -p "$package" --no-default-features --features ssr --all-targets -- -D warnings
          done
      - name: Docs library and CLI, each on its own
        run: |
          for package in rustify-docs rustify-docs-cli; do
            mbx test --locked -p "$package"
            mbx clippy --locked -p "$package" --all-targets -- -D warnings
          done
          mbx build --locked -p rustify-docs-cli --profile docs-cli
      - name: Independent theme consumer tests
        run: mbx test --locked --manifest-path tests/theme-export/Cargo.toml --workspace --bins
      - name: Makepad text layout and shaping checks
        run: sh tests/theme-text/run.sh --lib
      - name: Fork unit tests
        run: mbx test
        working-directory: makepad
      - name: Fork script VM tests
        run: mbx test --manifest-path platform/script/Cargo.toml
        working-directory: makepad
      - name: Clippy
        run: mbx clippy --locked --workspace --exclude rustify-docs --exclude rustify-docs-cli --all-targets -- -D warnings
      - name: Source record
        run: mbx xtask sources verify
      # The Tailwind CLI is the standalone binary mise.toml pins; no Node.
      - name: Component stylesheet is in step with the classes
        run: mbx xtask css --check
      - name: Capability document is in step with the catalogue
        run: mbx xtask catalog --write docs/components.md --check

  # A DOM application as an outside consumer builds it: its dependency graph
  # and product carry no Makepad, the GPU API compiles only with `gpu`, and
  # its instances keep the runtime's lifecycle contract in a browser.
  dom-only:
    name: DOM-only SDK
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust, mbx and Tailwind from mise.toml
        uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Default graph, product and GPU switch
        run: mbx xtask docs-verify --group features
      - name: Install pinned Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: DOM-only browser checks
        run: npx playwright test -c playwright.docs.config.ts --project=dom-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dom-only-results
          path: test-results/docs
          retention-days: 7

  # A built documentation site as readers reach it: through `rustify-docs
  # preview` at the root and under a base path, and through a static host
  # that sends no headers and rewrites nothing. One project per command.
  docs-site:
    name: docs site
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust, mbx and Tailwind from mise.toml
        uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install pinned Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Served by preview at the root
        run: npx playwright test -c playwright.docs.config.ts --project=docs-root
      - name: Served by preview under a base
        run: npx playwright test -c playwright.docs.config.ts --project=docs-subpath
      - name: Served by a static host with the policy in each page only
        run: npx playwright test -c playwright.docs.config.ts --project=docs-meta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-site-results
          path: test-results/docs
          retention-days: 7

  # The regression tier. Each example is built once, and its product is
  # handed to the test jobs as an artifact, so a shard does not spend four
  # minutes rebuilding what another job already built. The measurements live
  # in evidence.yml.
  build:
    name: build (${{ matrix.name }})
    runs-on: macos-14
    # Five to eight minutes normally. A runner that stopped answering has
    # held a build for over an hour, and every test job waits on the builds.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fusion-basic
            examples: fusion-basic
            sub_path: fusion-basic
          - name: property-workbench
            examples: property-workbench
            sub_path: property-workbench
          - name: catalog and data
            examples: component-catalog data-workbench
            sub_path: ""
          - name: vellum
            examples: vellum
            sub_path: ""
          - name: theme-studio
            examples: theme-studio
            sub_path: theme-studio
          - name: utility-lab
            examples: utility-lab
            sub_path: ""
    steps:
      - uses: actions/checkout@v4
      - name: Rust, mbx and Tailwind from mise.toml
        uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
      - name: Build
        run: |
          for example in ${{ matrix.examples }}; do
            mbx xtask build-web --example "$example" --release
          done
      # The sub-path projects serve builds made for their base.
      - name: Build the sub-path copy
        if: matrix.sub_path != ''
        run: mbx xtask build-web --example ${{ matrix.sub_path }} --release --base /tools/demo/
      # The default compiler-only Worker; the scanner build is a separate
      # product (`--utility-scanner`) checked by hand.
      - name: Build the utility-lab sub-path copy
        if: matrix.name == 'utility-lab'
        run: mbx xtask build-web --example utility-lab --release --base /tools/utility-lab/
      - name: Independent exported theme consumers
        if: matrix.name == 'theme-studio'
        run: |
          mbx fetch --locked --manifest-path tests/theme-export/Cargo.toml
          sh tests/theme-export/build.sh
          sh tests/theme-export/build.sh --base /tools/theme-export/ --out tests/theme-export/target/site-subpath
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'theme-studio'
        with:
          name: theme-consumers
          path: |
            tests/theme-export/target/site-root/
            tests/theme-export/target/site-subpath/
            tests/theme-export/target/debug/theme-export-serve
          if-no-files-found: error
          retention-days: 1
      # The whole release directory, so the artifact keeps one folder per
      # build rather than flattening a lone one into its root.
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ strategy.job-index }}
          path: target/makepad-wasm-app/release/
          retention-days: 1
      # The test jobs' static servers. xtask finds the builds through the
      # checkout path compiled into it, and every job of this workflow checks
      # out to the same path, so the binary one job compiled serves in all of
      # them - without them each spending over a minute compiling it again.
      - uses: actions/upload-artifact@v4
        if: strategy.job-index == 0
        with:
          name: xtask
          path: target/debug/xtask
          if-no-files-found: error
          retention-days: 1

  # A spec file runs whole in one shard, so shards are balanced by test count,
  # not time; two workers per job absorb the difference. Vellum fits in one
  # job on one worker.
  web:
    name: browser regression (${{ matrix.name }})
    needs: build
    runs-on: macos-14
    # Well over what a shard takes, and well under the six hours a stuck one
    # would otherwise hold a runner the other jobs are queueing for.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Four, not three: m1-probes and m2-runtime remount their scopes'
          # regions test after test, and with anything else beside them the
          # shard that holds both has run past ten minutes.
          - name: fusion-basic 1/4
            projects: --project=fusion-basic --shard=1/4 --workers=2
          - name: fusion-basic 2/4
            projects: --project=fusion-basic --shard=2/4 --workers=2
          - name: fusion-basic 3/4
            projects: --project=fusion-basic --shard=3/4 --workers=2
          - name: fusion-basic 4/4
            projects: --project=fusion-basic --shard=4/4 --workers=2
          # A job of its own: its checks switch the deployment server's
          # faults, so they run one at a time, and after a shard's other
          # tests they kept one worker busy for six minutes on their own.
          - name: deployment
            projects: --project=deployment
          - name: property-workbench 1/2
            projects: --project=property-workbench --project=workbench-deep --shard=1/2 --workers=2
          - name: property-workbench 2/2
            projects: --project=property-workbench --project=workbench-deep --shard=2/2 --workers=2
          - name: catalog and data 1/2
            projects: --project=component-catalog --project=data-workbench --shard=1/2 --workers=2
          - name: catalog and data 2/2
            projects: --project=component-catalog --project=data-workbench --shard=2/2 --workers=2
          - name: vellum
            projects: -c tests/vellum/playwright.config.ts
          - name: theme-studio
          - name: exported themes
          - name: utility-lab
    env:
      RUSTIFY_XTASK: ${{ github.workspace }}/target/debug/xtask
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: target/makepad-wasm-app/release/
      # An artifact does not keep the execute bit.
      - uses: actions/download-artifact@v4
        with:
          name: xtask
          path: target/debug/
      - run: chmod +x target/debug/xtask
      - uses: actions/download-artifact@v4
        if: matrix.name == 'exported themes'
        with:
          name: theme-consumers
          path: tests/theme-export/target/
      - run: chmod +x tests/theme-export/target/debug/theme-export-serve
        if: matrix.name == 'exported themes'
      - name: Install pinned Playwright
        run: npm ci && npx playwright install --with-deps chromium
      # utility-runtime.spec.ts compares against the pinned Tailwind, which has its own lock.
      - name: Install the pinned Tailwind oracle
        if: matrix.name == 'utility-lab'
        run: npm ci --ignore-scripts --prefix tests/utility/compiler/oracle
      - name: Regression tier (Playwright Chromium; not the macOS Chrome pass gate)
        if: matrix.name != 'theme-studio' && matrix.name != 'exported themes' && matrix.name != 'utility-lab'
        run: npx playwright test ${{ matrix.projects }}
      - name: Utility Lab root and sub-path regression
        if: matrix.name == 'utility-lab'
        run: |
          status=0
          npx playwright test --project=utility-lab --workers=1 --output=test-results/utility-lab || status=$?
          cp test-results/browser.json test-results/utility-lab.json 2>/dev/null || true
          npx playwright test --project=utility-lab-deep --workers=1 --output=test-results/utility-lab-deep || status=$?
          cp test-results/browser.json test-results/utility-lab-deep.json 2>/dev/null || true
          exit $status
      - name: Theme Studio root and sub-path regression
        if: matrix.name == 'theme-studio'
        run: |
          status=0
          npx playwright test --project=theme-studio --workers=1 --output=test-results/theme-studio || status=$?
          cp test-results/browser.json test-results/theme-studio.json 2>/dev/null || true
          npx playwright test --project=theme-studio-deep --workers=1 --output=test-results/theme-studio-deep || status=$?
          cp test-results/browser.json test-results/theme-studio-deep.json 2>/dev/null || true
          exit $status
      - name: Exported themes root and sub-path regression
        if: matrix.name == 'exported themes'
        run: |
          status=0
          npx playwright test --project=theme-export --workers=1 --output=test-results/theme-export || status=$?
          cp test-results/browser.json test-results/theme-export.json 2>/dev/null || true
          npx playwright test --project=theme-export-deep --workers=1 --output=test-results/theme-export-deep || status=$?
          cp test-results/browser.json test-results/theme-export-deep.json 2>/dev/null || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ strategy.job-index }}
          path: test-results
