name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Rust, mbx and Tailwind from mise.toml
        uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
      - name: Format
        run: cargo fmt --all -- --check
      # `--bins` as well: xtask and the examples are binaries, and their tests
      # do not run under `--lib`.
      - name: Unit tests
        run: mbx test --workspace --lib --bins
      - name: Fork unit tests
        run: mbx test
        working-directory: makepad
      - name: Fork script VM tests
        run: mbx test --manifest-path platform/script/Cargo.toml
        working-directory: makepad
      - name: Clippy
        run: mbx clippy --workspace --all-targets -- -D warnings
      - name: Source record
        run: mbx xtask sources verify
      # The Tailwind CLI is the standalone binary mise.toml pins; no Node.
      - name: Component stylesheet is in step with the classes
        run: mbx xtask css --check
      - name: Capability document is in step with the catalogue
        run: mbx xtask catalog --write docs/components.md --check

  # The regression tier, one job per example group so the slowest group is
  # the whole wait. Each job builds only what its projects serve. The
  # measurements live in evidence.yml.
  web:
    name: browser regression (${{ matrix.name }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fusion-basic
            examples: fusion-basic
            sub_path: fusion-basic
            projects: --project=fusion-basic --project=deployment
          - name: property-workbench
            examples: property-workbench
            sub_path: property-workbench
            projects: --project=property-workbench --project=workbench-deep
          - name: catalog and data
            examples: component-catalog data-workbench
            sub_path: ""
            projects: --project=component-catalog --project=data-workbench
          - name: vellum
            examples: vellum
            sub_path: ""
            projects: -c tests/vellum/playwright.config.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Rust, mbx and Tailwind from mise.toml
        uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
      - name: Build
        run: |
          for example in ${{ matrix.examples }}; do
            mbx xtask build-web --example "$example" --release
          done
      # The sub-path projects serve builds made for their base; the servers
      # only serve.
      - name: Build the sub-path copy
        if: matrix.sub_path != ''
        run: mbx xtask build-web --example ${{ matrix.sub_path }} --release --base /tools/demo/
      - name: Install pinned Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Regression tier (Playwright Chromium; not the macOS Chrome pass gate)
        run: npx playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ strategy.job-index }}
          path: test-results
