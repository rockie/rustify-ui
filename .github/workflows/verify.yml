name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: host checks
    runs-on: macos-14
    # A few minutes normally; the limit is for a runner that stops answering.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust, mbx and Tailwind from mise.toml
        uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
      - name: Format
        run: cargo fmt --all -- --check
      # `--bins` as well: xtask and the examples are binaries, and their tests
      # do not run under `--lib`.
      - name: Unit tests
        run: mbx test --workspace --lib --bins
      - name: Fork unit tests
        run: mbx test
        working-directory: makepad
      - name: Fork script VM tests
        run: mbx test --manifest-path platform/script/Cargo.toml
        working-directory: makepad
      - name: Clippy
        run: mbx clippy --workspace --all-targets -- -D warnings
      - name: Source record
        run: mbx xtask sources verify
      # The Tailwind CLI is the standalone binary mise.toml pins; no Node.
      - name: Component stylesheet is in step with the classes
        run: mbx xtask css --check
      - name: Capability document is in step with the catalogue
        run: mbx xtask catalog --write docs/components.md --check

  # The regression tier. Each example is built once, and its product is
  # handed to the test jobs as an artifact, so a shard does not spend four
  # minutes rebuilding what another job already built. The measurements live
  # in evidence.yml.
  build:
    name: build (${{ matrix.name }})
    runs-on: macos-14
    # Five to eight minutes normally. A runner that stopped answering has
    # held a build for over an hour, and every test job waits on the builds.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fusion-basic
            examples: fusion-basic
            sub_path: fusion-basic
          - name: property-workbench
            examples: property-workbench
            sub_path: property-workbench
          - name: catalog and data
            examples: component-catalog data-workbench
            sub_path: ""
          - name: vellum
            examples: vellum
            sub_path: ""
    steps:
      - uses: actions/checkout@v4
      - name: Rust, mbx and Tailwind from mise.toml
        uses: jdx/mise-action@v4
      - uses: jdx/mr-boxington-action@v1
      - name: Build
        run: |
          for example in ${{ matrix.examples }}; do
            mbx xtask build-web --example "$example" --release
          done
      # The sub-path projects serve builds made for their base.
      - name: Build the sub-path copy
        if: matrix.sub_path != ''
        run: mbx xtask build-web --example ${{ matrix.sub_path }} --release --base /tools/demo/
      # The whole release directory, so the artifact keeps one folder per
      # build rather than flattening a lone one into its root.
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ strategy.job-index }}
          path: target/makepad-wasm-app/release/
          retention-days: 1
      # The test jobs' static servers. xtask finds the builds through the
      # checkout path compiled into it, and every job of this workflow checks
      # out to the same path, so the binary one job compiled serves in all of
      # them - without them each spending over a minute compiling it again.
      - uses: actions/upload-artifact@v4
        if: strategy.job-index == 0
        with:
          name: xtask
          path: target/debug/xtask
          if-no-files-found: error
          retention-days: 1

  # A spec file runs whole in one shard, so shards are balanced by test count,
  # not time; two workers per job absorb the difference. Vellum fits in one
  # job on one worker.
  web:
    name: browser regression (${{ matrix.name }})
    needs: build
    runs-on: macos-14
    # Well over what a shard takes, and well under the six hours a stuck one
    # would otherwise hold a runner the other jobs are queueing for.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Four, not three: m1-probes and m2-runtime remount their scopes'
          # regions test after test, and with anything else beside them the
          # shard that holds both has run past ten minutes.
          - name: fusion-basic 1/4
            projects: --project=fusion-basic --shard=1/4 --workers=2
          - name: fusion-basic 2/4
            projects: --project=fusion-basic --shard=2/4 --workers=2
          - name: fusion-basic 3/4
            projects: --project=fusion-basic --shard=3/4 --workers=2
          - name: fusion-basic 4/4
            projects: --project=fusion-basic --shard=4/4 --workers=2
          # A job of its own: its checks switch the deployment server's
          # faults, so they run one at a time, and after a shard's other
          # tests they kept one worker busy for six minutes on their own.
          - name: deployment
            projects: --project=deployment
          - name: property-workbench 1/2
            projects: --project=property-workbench --project=workbench-deep --shard=1/2 --workers=2
          - name: property-workbench 2/2
            projects: --project=property-workbench --project=workbench-deep --shard=2/2 --workers=2
          - name: catalog and data 1/2
            projects: --project=component-catalog --project=data-workbench --shard=1/2 --workers=2
          - name: catalog and data 2/2
            projects: --project=component-catalog --project=data-workbench --shard=2/2 --workers=2
          - name: vellum
            projects: -c tests/vellum/playwright.config.ts
    env:
      RUSTIFY_XTASK: ${{ github.workspace }}/target/debug/xtask
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: target/makepad-wasm-app/release/
      # An artifact does not keep the execute bit.
      - uses: actions/download-artifact@v4
        with:
          name: xtask
          path: target/debug/
      - run: chmod +x target/debug/xtask
      - name: Install pinned Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Regression tier (Playwright Chromium; not the macOS Chrome pass gate)
        run: npx playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ strategy.job-index }}
          path: test-results
